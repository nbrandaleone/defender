<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defender — Rust/WASM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <header class="header">
      <h1>DEFENDER</h1>
      <p class="subtitle">Rust / WebAssembly &middot; Reverse-engineered from Defender: 1024</p>
    </header>

    <section class="hud" aria-label="Game status">
      <div class="hud-item">
        <span class="label">SCORE</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="hud-item">
        <span class="label">HUMANS</span>
        <span id="humans" class="value">10</span>
      </div>
      <div class="hud-item">
        <span class="label">ENEMIES</span>
        <span id="enemies" class="value">0</span>
      </div>
    </section>

    <div class="screen-wrap">
      <canvas id="game" width="510" height="320" aria-label="Defender game canvas"></canvas>
      <div id="overlay" class="overlay hidden" role="status" aria-live="polite">
        <h2>GAME OVER</h2>
        <p>Final Score: <strong id="final-score">0</strong></p>
        <button id="restart-btn" type="button">PLAY AGAIN (R)</button>
      </div>
    </div>

    <footer class="controls">
      <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> Thrust</span>
      <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> Climb / Dive</span>
      <span><kbd>Space</kbd> Fire Laser</span>
      <span><kbd>R</kbd> Restart</span>
    </footer>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
